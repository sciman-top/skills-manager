interface:
  display_name: "Capability Router"
  short_description: "Validate a cold skill when visible skills are insufficient"
  default_prompt: "Use $capability-router exactly once only when a named local skill is absent from visible metadata or the host has high confidence that visible skills are insufficient, including an interview-style verb combined with evidence grounding when no visible skill covers both. A quoted name, skill discussion, or ambiguous ordinary request is not an invocation; validate one candidate and its closure, keep host AI semantic selection authoritative, and never use it as per-request middleware."
policy:
  allow_implicit_invocation: true
