interface:
  display_name: "Capability Router"
  short_description: "Discover and validate a cold skill when visible skills are insufficient"
  default_prompt: "Use $capability-router exactly once when the user explicitly asks to use a local skill absent from current visible metadata, or the host has high confidence that no visible skill is a sufficient semantic match and a specialized workflow is materially needed. An interview-style verb (grill, interrogate, one question at a time) combined with evidence grounding is such an insufficiency signal when no single visible skill covers the combination. A quoted name, skill discussion, or ambiguous ordinary request is not an invocation; when uncertain, use ordinary reasoning or a visible skill. Pass the complete request and one or two functional domain hints (for example decision, engineering, coding, frontend, writing, presentation, mcp, dotnet, or python); a broad result that says domain_hint_required is not permission to retry as middleware. Keep host AI semantic selection authoritative after retrieval, validate one exact candidate and its dependency closure, and never use it as per-request middleware, switch profiles, or mutate host state."
policy:
  allow_implicit_invocation: true
