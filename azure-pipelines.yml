trigger:
- main

pr:
- main

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self

- pwsh: |
    if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required for authoritative gates." }
    $PSVersionTable.PSVersion.ToString()
    displayName: Verify PowerShell 7 runtime

- pwsh: |
    Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
  displayName: Install pinned Pester test runtime

- pwsh: |
    pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/quality/run-local-quality-gates.ps1 -Profile full
  displayName: Run authoritative full quality gate
