trigger:
- main

pr:
- main

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self

- pwsh: |
    if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required for authoritative gates." }
    $PSVersionTable.PSVersion.ToString()
  displayName: Verify PowerShell 7 primary runtime

- pwsh: |
    pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/quality/run-local-quality-gates.ps1 -Profile quick
  displayName: Run local quality gates

- powershell: |
    if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1 compatibility runtime." }
    [void][scriptblock]::Create((Get-Content -Raw .\skills.ps1))
    . .\src\Domain\OperationPlan.ps1
    . .\src\Domain\Receipt.ps1
    $plan = New-OperationPlan -OperationId azure-compat -Domain runtime -Mode dry_run -CreatedAt 2026-08-01T08:00:00Z
    $receipt = New-OperationReceipt -OperationId azure-compat -Status dry_run -StartedAt 2026-08-01T08:00:00Z -CompletedAt 2026-08-01T08:00:01Z
    if ($plan.schema_version -ne 1 -or $receipt.schema_version -ne 1) { throw "Compatibility object smoke failed." }
  displayName: Windows PowerShell 5.1 bounded compatibility smoke
