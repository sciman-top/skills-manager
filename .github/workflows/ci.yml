name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell 7 runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required for authoritative gates." }
          $PSVersionTable.PSVersion.ToString()

      - name: Install pinned Pester test runtime
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run repository full quality gate
        shell: pwsh
        env:
          SKILLS_SYNC_MCP_THRESHOLD_MS: 12000
        run: .\scripts\quality\run-local-quality-gates.ps1 -Profile full
