name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify PowerShell 7 runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required for authoritative gates." }
          $PSVersionTable.PSVersion.ToString()

      - name: Install pinned Pester test runtime
        shell: pwsh
        run: |
          $packageUri = 'https://www.powershellgallery.com/api/v2/package/Pester/4.10.1'
          $expectedSha256 = '898210e1a30c52cd46ba317c2278a9324345214213aa2f7d6b7dfa7b98f37ac9'
          $packagePath = Join-Path $env:RUNNER_TEMP 'Pester.4.10.1.nupkg'
          $moduleBase = Join-Path $env:RUNNER_TEMP 'verified-modules'
          $moduleRoot = Join-Path $moduleBase 'Pester\4.10.1'

          Invoke-WebRequest -Uri $packageUri -OutFile $packagePath -UseBasicParsing
          $actualSha256 = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -cne $expectedSha256) {
            throw "Pester package hash mismatch: expected=$expectedSha256 actual=$actualSha256"
          }
          if (Test-Path -LiteralPath $moduleRoot) {
            throw "Refusing to overwrite an existing module path: $moduleRoot"
          }

          $null = New-Item -ItemType Directory -Path $moduleRoot -Force
          [System.IO.Compression.ZipFile]::ExtractToDirectory($packagePath, $moduleRoot)
          $manifest = Join-Path $moduleRoot 'Pester.psd1'
          Import-Module -Name $manifest -Force
          if ((Get-Module Pester).Version -ne [version]'4.10.1') {
            throw 'Verified Pester 4.10.1 did not load.'
          }

                "PSModulePath=$moduleBase$([System.IO.Path]::PathSeparator)$env:PSModulePath" |
                  Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rebuild locked skill sources
        shell: pwsh
        run: .\skills.ps1 更新 -Locked -SkipHostProjection

      - name: Run repository full quality gate
        shell: pwsh
        run: .\scripts\quality\run-local-quality-gates.ps1 -Profile full

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild locked skill sources
        shell: pwsh
        run: .\skills.ps1 更新 -Locked -SkipHostProjection

      - name: Build release packages
        shell: pwsh
        run: .\scripts\release\build-release.ps1 -Version '${{ github.ref_name }}'

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | Where-Object { $_.Name -match '\.(zip|txt)$' })
          if ($assets.Count -ne 3) { throw "Expected 3 release assets, found $($assets.Count)." }
          gh release create '${{ github.ref_name }}' @($assets.FullName) --verify-tag --generate-notes --title '${{ github.ref_name }}'
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
