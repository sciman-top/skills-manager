name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify PowerShell 7 runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required for authoritative gates." }
          $PSVersionTable.PSVersion.ToString()

      - name: Ensure pinned Pester test runtime
        shell: pwsh
        run: .\scripts\quality\ensure-test-runtime.ps1 -CacheRoot $env:RUNNER_TEMP -ExportToGitHubEnv

      - name: Rebuild locked skill sources
        shell: pwsh
        run: .\skills.ps1 更新 -Locked -SkipHostProjection

      - name: Run repository proportional quality gate
        shell: pwsh
        run: |
          $profile = if ('${{ github.event_name }}' -eq 'pull_request' -or '${{ github.ref }}'.StartsWith('refs/tags/')) { 'full' } else { 'quick' }
          .\scripts\quality\run-local-quality-gates.ps1 -Profile $profile

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild locked skill sources
        shell: pwsh
        run: .\skills.ps1 更新 -Locked -SkipHostProjection

      - name: Build release packages
        shell: pwsh
        run: .\scripts\release\build-release.ps1 -Version '${{ github.ref_name }}'

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | Where-Object { $_.Name -match '\.(zip|txt)$' })
          if ($assets.Count -ne 3) { throw "Expected 3 release assets, found $($assets.Count)." }
          gh release create '${{ github.ref_name }}' @($assets.FullName) --verify-tag --generate-notes --title '${{ github.ref_name }}'
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
