name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify PowerShell 7 runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required for authoritative gates." }
          $PSVersionTable.PSVersion.ToString()

      - name: Ensure pinned Pester test runtime
        shell: pwsh
        run: .\scripts\quality\ensure-test-runtime.ps1 -CacheRoot $env:RUNNER_TEMP -ExportToGitHubEnv

      - name: Select proportional quality gate profile
        shell: pwsh
        run: |
          $profile = 'full'
          $docsOnly = $false
          $baseSha = ''
          $focusedTests = @()
          if ('${{ github.ref }}'.StartsWith('refs/tags/') -or '${{ github.event_name }}' -eq 'push') {
            $profile = 'full'
          }
          else {
            $baseSha = if ('${{ github.event_name }}' -eq 'pull_request') { '${{ github.event.pull_request.base.sha }}' } else { '${{ github.event.before }}' }
            if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -match '^0+$') {
              $profile = 'full'
            }
            else {
              & git cat-file -e ($baseSha + '^{commit}') 2>$null
              if ($LASTEXITCODE -ne 0) {
                & git fetch --no-tags --depth=1 origin $baseSha
              }
              if ($LASTEXITCODE -ne 0) {
                $profile = 'full'
              }
              else {
                $resolved = & .\scripts\quality\resolve-gate-profile.ps1 -BaseSha $baseSha -Mode ci -Json | ConvertFrom-Json
                $profile = [string]$resolved.profile
                $docsOnly = [bool]$resolved.docs_only
                $focusedTests = @($resolved.focused_test_paths)
              }
            }
          }
          "CI_GATE_PROFILE=$profile" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_DIFF_BASE_SHA=$baseSha" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_FOCUSED_TEST_PATHS=$($focusedTests | ConvertTo-Json -Compress)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Selected CI quality gate profile: $profile"
          Write-Host "Documentation-only diff: $docsOnly"

      - name: Rebuild locked skill sources
        shell: pwsh
        run: |
          if ($env:CI_GATE_PROFILE -ne 'docs') {
            .\skills.ps1 更新 -Locked -SkipHostProjection
          }

      - name: Run repository proportional quality gate
        shell: pwsh
        run: |
          $gateArgs = @('-Profile', $env:CI_GATE_PROFILE, '-DiffBase', $env:CI_DIFF_BASE_SHA)
          if ($env:CI_GATE_PROFILE -eq 'focused') {
            $testPaths = @($env:CI_FOCUSED_TEST_PATHS | ConvertFrom-Json)
            $gateArgs += @('-TestPath') + $testPaths + @('-Verifier', 'lock', 'integrity', 'config', 'scheduler')
          }
          .\scripts\quality\run-local-quality-gates.ps1 @gateArgs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild locked skill sources
        shell: pwsh
        run: .\skills.ps1 更新 -Locked -SkipHostProjection

      - name: Build release packages
        shell: pwsh
        run: .\scripts\release\build-release.ps1 -Version '${{ github.ref_name }}'

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*-SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | Where-Object { $_.Name -match '\.(zip|txt)$' })
          if ($assets.Count -ne 3) { throw "Expected 3 release assets, found $($assets.Count)." }
          gh release create '${{ github.ref_name }}' @($assets.FullName) --verify-tag --generate-notes --title '${{ github.ref_name }}'
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
