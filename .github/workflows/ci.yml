name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell 7 primary runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required for authoritative gates." }
          $PSVersionTable.PSVersion.ToString()

      - name: Install pinned Pester test runtime
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run repository full quality gate
        shell: pwsh
        env:
          SKILLS_SYNC_MCP_THRESHOLD_MS: 12000
        run: .\scripts\quality\run-local-quality-gates.ps1 -Profile full

      - name: Windows PowerShell 5.1 bounded compatibility smoke
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1 compatibility runtime." }
          [void][scriptblock]::Create((Get-Content -Raw .\skills.ps1))
          . .\src\Domain\OperationPlan.ps1
          . .\src\Domain\Receipt.ps1
          $plan = New-OperationPlan -OperationId ci-compat -Domain runtime -Mode dry_run -CreatedAt 2026-08-01T08:00:00Z
          $receipt = New-OperationReceipt -OperationId ci-compat -Status dry_run -StartedAt 2026-08-01T08:00:00Z -CompletedAt 2026-08-01T08:00:01Z
          if ($plan.schema_version -ne 1 -or $receipt.schema_version -ne 1) { throw "Compatibility object smoke failed." }
