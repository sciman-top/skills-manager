approval_policy = "on-request"

# 生成物守卫与 Stop 验证守卫。命令一律从 git 根解析，因为 Codex 可能从子目录启动
# （learn.chatgpt.com/docs/hooks）。两个脚本与 Claude Code 共用，脚本本身只有一个副本。
# Codex 把 Bash 统一记为 tool_name=Bash，apply_patch 的编辑记为 apply_patch，
# 因此 PreToolUse 同时匹配两者。项目级 hook 首次使用需在 `/hooks` 审查并信任。

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'pwsh -NoProfile -File "$(git rev-parse --show-toplevel)/scripts/guard-generated.ps1"'
command_windows = 'pwsh -NoProfile -File "$(git rev-parse --show-toplevel)/scripts/guard-generated.ps1"'
timeout = 30
statusMessage = "Checking generated-file write boundary"

[[hooks.PreToolUse]]
matcher = "^apply_patch$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'pwsh -NoProfile -File "$(git rev-parse --show-toplevel)/scripts/guard-generated.ps1"'
command_windows = 'pwsh -NoProfile -File "$(git rev-parse --show-toplevel)/scripts/guard-generated.ps1"'
timeout = 30
statusMessage = "Checking generated-file write boundary"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'pwsh -NoProfile -File "$(git rev-parse --show-toplevel)/scripts/guard-stop-verification.ps1"'
command_windows = 'pwsh -NoProfile -File "$(git rev-parse --show-toplevel)/scripts/guard-stop-verification.ps1"'
timeout = 180
statusMessage = "Checking generated-bundle drift and verification evidence"
